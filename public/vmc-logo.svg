<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <!-- Background is transparent to fit on any white or light card -->
  <!-- Letters: V M C in vibrant scarlet red serif font -->
  <text 
    x="230" 
    y="86" 
    text-anchor="middle" 
    font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Times, Georgia, serif" 
    font-size="96" 
    font-weight="900" 
    letter-spacing="8" 
    fill="#E60000"
  >VMC</text>

  <!-- Red Curved Dynamic Swoosh cutting horizontally across the letters -->
  <path 
    fill="#E60000" 
    d="M 12,86 C 120,48 210,40 230,40 C 250,40 340,48 448,86 C 340,42 250,33 230,33 C 210,33 120,42 12,86 Z"
  />
</svg>
